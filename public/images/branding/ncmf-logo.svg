<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="45%" stop-color="#D49526" />
      <stop offset="100%" stop-color="#8C5815" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49526" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5C05C" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Crest -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Film Reel Frame -->
    <circle cx="50" cy="50" r="46" stroke="url(#goldGrad)" stroke-width="2.5" fill="#0C1322" />
    <circle cx="50" cy="50" r="41" stroke="#D49526" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 2" />

    <!-- Film strip apertures on edge -->
    <g fill="url(#goldGrad)" opacity="0.85">
      <rect x="47" y="6" width="6" height="5" rx="1" />
      <rect x="47" y="89" width="6" height="5" rx="1" />
      <rect x="6" y="47" width="5" height="6" rx="1" />
      <rect x="89" y="47" width="5" height="6" rx="1" />
      <rect x="18" y="18" width="5" height="5" rx="1" transform="rotate(-45 20.5 20.5)" />
      <rect x="76" y="18" width="5" height="5" rx="1" transform="rotate(45 78.5 20.5)" />
      <rect x="18" y="76" width="5" height="5" rx="1" transform="rotate(45 20.5 78.5)" />
      <rect x="76" y="76" width="5" height="5" rx="1" transform="rotate(-45 78.5 78.5)" />
    </g>

    <!-- Center Clapperboard & Star Motif -->
    <path d="M 28 38 L 72 38 L 72 44 L 28 44 Z" fill="url(#goldGrad)" />
    <path d="M 28 48 L 72 48 L 72 68 C 72 75 62 80 50 80 C 38 80 28 75 28 68 Z" fill="#141E30" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Diagonal clapper stripes -->
    <line x1="36" y1="38" x2="41" y2="44" stroke="#0C1322" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="38" x2="53" y2="44" stroke="#0C1322" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="38" x2="65" y2="44" stroke="#0C1322" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Radiant Star in Crest -->
    <path d="M 50 54 L 52 60 L 58 60 L 53 64 L 55 70 L 50 66 L 45 70 L 47 64 L 42 60 L 48 60 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- Main Acronym & Title -->
    <text x="0" y="32" font-family="'Cinzel', Georgia, serif" font-weight="800" font-size="34" letter-spacing="4" fill="url(#goldGrad)">NCMF</text>
    
    <!-- Badge: EST. 2015 -->
    <rect x="135" y="14" width="76" height="20" rx="10" fill="#141E30" stroke="#D49526" stroke-width="1"/>
    <text x="145" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" fill="#F5C05C">EST. 2015</text>

    <!-- Subtitle: Full Name -->
    <text x="2" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" letter-spacing="1.8" fill="#F1F5F9">NOLLYWOOD CREATIVE MINDS FORUM</text>
    
    <!-- Motto: Optimizing Potentials -->
    <g transform="translate(2, 74)">
      <line x1="0" y1="-5" x2="28" y2="-5" stroke="#D49526" stroke-width="1.5" opacity="0.6"/>
      <text x="36" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-style="italic" font-weight="500" font-size="11.5" letter-spacing="2" fill="#D49526">“OPTIMIZING POTENTIALS”</text>
      <line x1="225" y1="-5" x2="253" y2="-5" stroke="#D49526" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>
</svg>
